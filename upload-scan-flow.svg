<?xml version="1.0" encoding="UTF-8"?>
<svg
          viewBox="0 0 1280 720"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-labelledby="upload-flow-title upload-flow-desc" id="upload-scan-flow-root"
        >
          <title id="upload-flow-title">R2 Image Review Architecture</title>
          <desc id="upload-flow-desc">
            The browser uploads directly to a private R2 bucket. A Queue message runs the scanner in the same Void Worker. D1 tracks review results, and the API serves only approved files.
          </desc>
          <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #upload-scan-flow-root { color: #2d3142; font-family: "Geist", "Noto Sans KR", system-ui, sans-serif; }
      #upload-scan-flow-root .diagram-container { width: 100%;
        overflow-x: auto; }
      @media print {
#upload-scan-flow-root .diagram-container { overflow-x: visible; }
}
      #upload-scan-flow-root .title { font:
          400 30px "Instrument Serif",
          "Noto Serif KR",
          serif;
        fill: #2d3142; }
      #upload-scan-flow-root .node-title { font:
          600 13px "Geist",
          "Noto Sans KR",
          sans-serif;
        fill: #2d3142; }
      #upload-scan-flow-root .node-copy { font:
          400 10px "Geist",
          "Noto Sans KR",
          sans-serif;
        fill: #4f5d75; }
      #upload-scan-flow-root .mono { font:
          400 8px "Geist Mono",
          ui-monospace,
          monospace;
        fill: #5a6580; }
      #upload-scan-flow-root .arrow-label { font:
          400 8px "Geist Mono",
          ui-monospace,
          monospace;
        fill: #2d3142; }
      #upload-scan-flow-root .legend { font:
          400 8px "Geist Mono",
          ui-monospace,
          monospace;
        fill: #4f5d75; }</style>
            <marker id="upload-scan-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <path d="M0 0 8 3 0 6Z" fill="#4f5d75" />
            </marker>
            <marker
              id="upload-scan-flow-arrow-link"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <path d="M0 0 8 3 0 6Z" fill="#2e5aa8" />
            </marker>
            <marker
              id="upload-scan-flow-arrow-open"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <path d="M0 0 8 3 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2" />
            </marker>
          </defs>
          <rect width="1280" height="720" fill="#f5f5f5" />

          <!-- Worker boundary -->
          <rect
            x="315"
            y="142"
            width="350"
            height="478"
            rx="8"
            fill="#2d3142"
            stroke="#2d3142"
            stroke-width="1"
            stroke-dasharray="5,4" fill-opacity="0.02" stroke-opacity="0.24"
          />
          <rect x="331" y="136" width="182" height="15" rx="2" fill="#f5f5f5" />
          <text x="337" y="147" class="eyebrow">ONE VOID WORKER DEPLOYMENT</text>

          <!-- Connections first -->
          <path
            d="M230 260H339"
            fill="none"
            stroke="#2e5aa8"
            stroke-width="1.4"
            marker-end="url(#upload-scan-flow-arrow-link)"
          />
          <rect x="249" y="241" width="71" height="13" fill="#f5f5f5" />
          <text x="284" y="250" text-anchor="middle" class="arrow-label">HTTP request</text>

          <path
            d="M339 292H230"
            fill="none"
            stroke="#2e5aa8"
            stroke-width="1.2"
            stroke-dasharray="4,3"
            marker-end="url(#upload-scan-flow-arrow-link)"
          />
          <rect x="249" y="300" width="71" height="13" fill="#f5f5f5" />
          <text x="284" y="309" text-anchor="middle" class="arrow-label">SSE / file</text>

          <path
            d="M143 220V104H875V126"
            fill="none"
            stroke="#2e5aa8"
            stroke-width="1.4"
            marker-end="url(#upload-scan-flow-arrow-link)"
          />
          <rect x="470" y="82" width="83" height="13" fill="#f5f5f5" />
          <text x="511" y="91" text-anchor="middle" class="arrow-label">signed PUT</text>

          <path
            d="M875 246V332"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.1"
            stroke-dasharray="4,3"
            marker-end="url(#upload-scan-flow-arrow-open)"
          />
          <rect x="883" y="279" width="78" height="13" fill="#f5f5f5" />
          <text x="922" y="288" text-anchor="middle" class="arrow-label">ObjectCreated</text>

          <path
            d="M770 382H641"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.2"
            stroke-dasharray="4,3"
            marker-end="url(#upload-scan-flow-arrow-open)"
          />
          <rect x="680" y="362" width="52" height="13" fill="#f5f5f5" />
          <text x="706" y="371" text-anchor="middle" class="arrow-label">scan job</text>

          <path
            d="M770 190H700V352H500V361"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.1"
            marker-end="url(#upload-scan-flow-arrow)"
          />
          <rect x="719" y="167" width="34" height="13" fill="#f5f5f5" />
          <text x="736" y="176" text-anchor="middle" class="arrow-label">bytes</text>

          <path
            d="M665 576H770"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.1"
            marker-end="url(#upload-scan-flow-arrow)"
          />
          <rect x="697" y="557" width="40" height="13" fill="#f5f5f5" />
          <text x="717" y="566" text-anchor="middle" class="arrow-label">write</text>

          <path
            d="M770 600H665"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1"
            marker-end="url(#upload-scan-flow-arrow)"
          />
          <rect x="697" y="612" width="40" height="13" fill="#f5f5f5" />
          <text x="717" y="621" text-anchor="middle" class="arrow-label">status</text>

          <path
            d="M620 620V671H1120V642"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#upload-scan-flow-arrow)"
          />
          <rect x="834" y="650" width="91" height="13" fill="#f5f5f5" />
          <text x="879" y="659" text-anchor="middle" class="arrow-label">clean · serve</text>

          <!-- Browser -->
          <rect
            x="56"
            y="220"
            width="174"
            height="148"
            rx="6"
            fill="#ececec"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text x="74" y="247" class="eyebrow">CLIENT</text>
          <text x="74" y="271" class="node-title">Browser</text>
          <text x="74" y="290" class="node-copy">Send name, type, size</text>
          <text x="74" y="306" class="node-copy">Get signed URL</text>
          <text x="74" y="322" class="node-copy">Upload directly to private R2</text>
          <text x="74" y="338" class="node-copy">Get status, list, and file</text>

          <!-- Worker internal handlers -->
          <rect
            x="339"
            y="176"
            width="302"
            height="172"
            rx="6"
            fill="#fff"
            stroke="#bfc0c0"
            stroke-width="1"
          />
          <rect x="355" y="190" width="32" height="15" rx="2" fill="#ececec" />
          <text x="371" y="201" text-anchor="middle" class="eyebrow">API</text>
          <text x="397" y="202" class="node-title">HTTP endpoints</text>
          <text x="355" y="226" class="mono">POST /api/uploads</text>
          <text x="355" y="242" class="node-copy">Save uploading status; sign PUT URL</text>
          <text x="355" y="261" class="mono">GET /api/uploads?id=…</text>
          <text x="355" y="277" class="node-copy">Check D1 each second; send status changes</text>
          <text x="355" y="293" class="node-copy">Close when ready or rejected</text>
          <text x="355" y="312" class="mono">GET /api/public/:id</text>
          <text x="355" y="330" class="node-copy">Read from R2 only when D1 says ready</text>

          <rect
            x="339"
            y="361"
            width="302"
            height="192"
            rx="6"
            fill="#bf4520"
            stroke="#bf4520"
            stroke-width="1.4" fill-opacity="0.08"
          />
          <rect x="355" y="375" width="72" height="15" rx="2" fill="#bf4520" />
          <text x="391" y="386" text-anchor="middle" class="eyebrow" fill="#fff">QUEUE</text>
          <text x="438" y="387" class="node-title">Scanner</text>
          <text x="355" y="411" class="mono">queues/scan-uploads.ts · same Worker</text>
          <text x="355" y="430" class="node-copy">
            5 MB limit · check actual type · scan EICAR
          </text>
          <text x="355" y="448" class="node-copy">Remove photo metadata; make a safe copy</text>
          <line x1="355" y1="462" x2="625" y2="462" stroke="#2d3142" stroke-opacity="0.16" />
          <text x="355" y="482" class="node-copy">Safe: copy to public R2 → D1 ready</text>
          <text x="355" y="501" class="node-copy">Unsafe: delete from private R2 → D1 rejected</text>
          <text x="355" y="526" class="node-copy">Acknowledge successful Queue messages</text>

          <!-- Quarantine R2 -->
          <rect
            x="770"
            y="126"
            width="210"
            height="120"
            rx="6"
            fill="#fff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <rect x="786" y="140" width="38" height="15" rx="2" fill="#ececec" />
          <text x="805" y="151" text-anchor="middle" class="eyebrow">R2</text>
          <text x="834" y="152" class="node-title">Private bucket</text>
          <text x="786" y="179" class="node-copy">Private; browser uploads directly</text>
          <text x="786" y="197" class="node-copy">New-file event sends a Queue message</text>
          <text x="786" y="215" class="node-copy">Delete original after review</text>
          <text x="786" y="234" class="mono">upload-quarantine-demo</text>

          <!-- Queue -->
          <rect
            x="770"
            y="332"
            width="210"
            height="100"
            rx="6"
            fill="#fff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <rect x="786" y="346" width="58" height="15" rx="2" fill="#ececec" />
          <text x="815" y="357" text-anchor="middle" class="eyebrow">QUEUE</text>
          <text x="854" y="358" class="node-title">scan-uploads</text>
          <text x="786" y="385" class="node-copy">Delivers files waiting for review</text>
          <text x="786" y="404" class="node-copy">Retries failed messages</text>
          <text x="786" y="423" class="mono">Cloudflare Queues</text>

          <!-- D1 -->
          <rect
            x="770"
            y="536"
            width="210"
            height="106"
            rx="6"
            fill="#fff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <rect x="786" y="550" width="32" height="15" rx="2" fill="#ececec" />
          <text x="802" y="561" text-anchor="middle" class="eyebrow">DB</text>
          <text x="829" y="562" class="node-title">D1 · uploads</text>
          <text x="786" y="588" class="mono">uploading → scanning</text>
          <text x="786" y="606" class="mono">→ ready | rejected</text>
          <text x="786" y="627" class="node-copy">Stores status, file type, and rejection reason</text>

          <!-- Public R2 -->
          <rect
            x="1032"
            y="536"
            width="198"
            height="106"
            rx="6"
            fill="#fff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <rect x="1048" y="550" width="38" height="15" rx="2" fill="#ececec" />
          <text x="1067" y="561" text-anchor="middle" class="eyebrow">R2</text>
          <text x="1096" y="562" class="node-title">Approved files</text>
          <text x="1048" y="588" class="node-copy">Stored after review and metadata removal</text>
          <text x="1048" y="606" class="node-copy">Served by API only when ready</text>
          <text x="1048" y="627" class="mono">upload-public-demo</text>

          <!-- Bottom legend -->
          <line x1="42" y1="694" x2="1238" y2="694" stroke="#2d3142" stroke-opacity="0.16" />
          <line
            x1="62"
            y1="708"
            x2="100"
            y2="708"
            stroke="#2e5aa8"
            stroke-width="1.4"
            marker-end="url(#upload-scan-flow-arrow-link)"
          />
          <text x="110" y="711" class="legend">Browser request / response</text>
          <line
            x1="288"
            y1="708"
            x2="326"
            y2="708"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#upload-scan-flow-arrow)"
          />
          <text x="336" y="711" class="legend">Storage / database work</text>
          <line
            x1="490"
            y1="708"
            x2="528"
            y2="708"
            stroke="#4f5d75"
            stroke-width="1.1"
            stroke-dasharray="4,3"
            marker-end="url(#upload-scan-flow-arrow-open)"
          />
          <text x="538" y="711" class="legend">Background event / Queue message</text>
          <text x="1235" y="711" text-anchor="end" class="legend">
            Public R2 is private; API checks status before serving
          </text>
        </svg>
