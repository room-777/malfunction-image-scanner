          />
          <rect x="834" y="650" width="91" height="13" fill="#f5f5f5" />
          <text x="879" y="659" text-anchor="middle" class="arrow-label">안전한 파일 전달</text>

          <!-- 브라우저 -->
          <rect
            x="56"
            y="220"
            width="174"
            height="148"
            rx="6"
            fill="#ececec"
            stroke="#2d3142"
            stroke-width="1"
          />
          <text x="74" y="247" class="eyebrow">사용자</text>
          <text x="74" y="271" class="node-title">브라우저</text>
          <text x="74" y="290" class="node-copy">이름·형식·크기 전송</text>
          <text x="74" y="306" class="node-copy">임시 업로드 주소 받기</text>
          <text x="74" y="322" class="node-copy">비공개 R2에 직접 업로드</text>
          <text x="74" y="338" class="node-copy">상태·목록·파일 보기</text>

          <!-- Worker internal handlers -->
          <rect
            x="339"
            y="176"
            width="302"
            height="172"
            rx="6"
            fill="#fff"
            stroke="#bfc0c0"
            stroke-width="1"
          />
          <rect x="355" y="190" width="32" height="15" rx="2" fill="#ececec" />
          <text x="371" y="201" text-anchor="middle" class="eyebrow">API</text>
          <text x="397" y="202" class="node-title">요청 처리</text>
          <text x="355" y="226" class="mono">POST /api/uploads</text>
          <text x="355" y="242" class="node-copy">uploading 상태 저장, PUT 주소 발급</text>
          <text x="355" y="261" class="mono">GET /api/uploads?id=…</text>
          <text x="355" y="277" class="node-copy">매초 D1 확인, 바뀐 상태 알림</text>
          <text x="355" y="293" class="node-copy">ready 또는 rejected면 연결 종료</text>
          <text x="355" y="312" class="mono">GET /api/public/:id</text>
          <text x="355" y="330" class="node-copy">D1이 ready인 파일만 R2에서 읽기</text>

          <rect
            x="339"
            y="361"
            width="302"
            height="192"
            rx="6"
            fill="#bf4520"
            stroke="#bf4520"
            stroke-width="1.4" fill-opacity="0.08"
          />
          <rect x="355" y="375" width="72" height="15" rx="2" fill="#bf4520" />
          <text x="391" y="386" text-anchor="middle" class="eyebrow" fill="#fff">대기열</text>
          <text x="438" y="387" class="node-title">검사 코드</text>
          <text x="355" y="411" class="mono">queues/scan-uploads.ts · 같은 Worker</text>
          <text x="355" y="430" class="node-copy">
            5MB 제한 · 실제 형식 확인 · EICAR 검사
          </text>
          <text x="355" y="448" class="node-copy">사진 정보 제거 후 안전한 사본 생성</text>
          <line x1="355" y1="462" x2="625" y2="462" stroke="#2d3142" stroke-opacity="0.16" />
          <text x="355" y="482" class="node-copy">안전: 공개 R2에 복사 → D1 ready</text>
          <text x="355" y="501" class="node-copy">위험: 비공개 R2에서 삭제 → D1 rejected</text>
          <text x="355" y="526" class="node-copy">성공한 작업 알림 확인 처리</text>

          <!-- Quarantine R2 -->
          <rect
            x="770"
            y="126"
            width="210"
            height="120"
            rx="6"
            fill="#fff"
            stroke="#2d3142"
            stroke-width="1"
