          />
          <text x="110" y="711" class="legend">브라우저 요청 / 응답</text>
          <line
            x1="288"
            y1="708"
            x2="326"
            y2="708"
            stroke="#4f5d75"
            stroke-width="1.2"
            marker-end="url(#upload-scan-flow-arrow)"
          />
          <text x="336" y="711" class="legend">저장소 / 데이터베이스 작업</text>
          <line
            x1="490"
            y1="708"
            x2="528"
            y2="708"
            stroke="#4f5d75"
            stroke-width="1.1"
