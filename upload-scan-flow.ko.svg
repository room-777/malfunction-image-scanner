<?xml version="1.0" encoding="UTF-8"?>
<svg
          viewBox="0 0 1280 720"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-labelledby="upload-flow-title upload-flow-desc" id="upload-scan-flow-root"
        >
          <title id="upload-flow-title">R2 이미지 검사 구조</title>
          <desc id="upload-flow-desc">
            브라우저가 비공개 R2에 직접 파일을 올립니다. Queue 메시지가 같은 Void Worker 안의 검사 코드를 실행합니다. D1이 검사 결과를 기록하고, API는 통과한 파일만 전달합니다.
          </desc>
          <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #upload-scan-flow-root { color: #2d3142; font-family: "Geist", "Noto Sans KR", system-ui, sans-serif; }
      #upload-scan-flow-root .diagram-container { width: 100%;
        overflow-x: auto; }
      @media print {
#upload-scan-flow-root .diagram-container { overflow-x: visible; }
}
      #upload-scan-flow-root .title { font:
          400 30px "Instrument Serif",
          "Noto Serif KR",
          serif;
        fill: #2d3142; }
      #upload-scan-flow-root .node-title { font:
          600 13px "Geist",
          "Noto Sans KR",
          sans-serif;
        fill: #2d3142; }
      #upload-scan-flow-root .node-copy { font:
          400 10px "Geist",
          "Noto Sans KR",
          sans-serif;
        fill: #4f5d75; }
      #upload-scan-flow-root .mono { font:
          400 8px "Geist Mono",
          ui-monospace,
          monospace;
        fill: #5a6580; }
      #upload-scan-flow-root .arrow-label { font:
          400 8px "Geist Mono",
          ui-monospace,
          monospace;
        fill: #2d3142; }
      #upload-scan-flow-root .legend { font:
          400 8px "Geist Mono",
          ui-monospace,
          monospace;
        fill: #4f5d75; }</style>
            <marker id="upload-scan-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <path d="M0 0 8 3 0 6Z" fill="#4f5d75" />
            </marker>
            <marker
              id="upload-scan-flow-arrow-link"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <path d="M0 0 8 3 0 6Z" fill="#2e5aa8" />
            </marker>
            <marker
              id="upload-scan-flow-arrow-open"
              markerWidth="8"
              markerHeight="6"
              refX="7"
              refY="3"
              orient="auto"
            >
              <path d="M0 0 8 3 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2" />
            </marker>
          </defs>
          <rect width="1280" height="720" fill="#f5f5f5" />

          <!-- Worker boundary -->
          <rect
            x="315"
            y="142"
            width="350"
            height="478"
            rx="8"
            fill="#2d3142"
            stroke="#2d3142"
            stroke-width="1"
            stroke-dasharray="5,4" fill-opacity="0.02" stroke-opacity="0.24"
          />
          <rect x="331" y="136" width="182" height="15" rx="2" fill="#f5f5f5" />
          <text x="337" y="147" class="eyebrow">단일 VOID WORKER 배포</text>

          <!-- Connections first -->
          <path
            d="M230 260H339"
            fill="none"
            stroke="#2e5aa8"
            stroke-width="1.4"
            marker-end="url(#upload-scan-flow-arrow-link)"
          />
          <rect x="249" y="241" width="71" height="13" fill="#f5f5f5" />
          <text x="284" y="250" text-anchor="middle" class="arrow-label">HTTP 요청</text>

          <path
            d="M339 292H230"
            fill="none"
            stroke="#2e5aa8"
            stroke-width="1.2"
            stroke-dasharray="4,3"
            marker-end="url(#upload-scan-flow-arrow-link)"
          />
          <rect x="249" y="300" width="71" height="13" fill="#f5f5f5" />
          <text x="284" y="309" text-anchor="middle" class="arrow-label">상태 알림 / 파일</text>

          <path
            d="M143 220V104H875V126"
