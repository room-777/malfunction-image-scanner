          <path
            d="M875 246V332"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.1"
            stroke-dasharray="4,3"
            marker-end="url(#upload-scan-flow-arrow-open)"
          />
          <rect x="883" y="279" width="78" height="13" fill="#f5f5f5" />
          <text x="922" y="288" text-anchor="middle" class="arrow-label">새 파일 알림</text>

          <path
            d="M770 382H641"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.2"
            stroke-dasharray="4,3"
            marker-end="url(#upload-scan-flow-arrow-open)"
          />
          <rect x="680" y="362" width="52" height="13" fill="#f5f5f5" />
          <text x="706" y="371" text-anchor="middle" class="arrow-label">검사 작업</text>

          <path
            d="M770 190H700V352H500V361"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.1"
            marker-end="url(#upload-scan-flow-arrow)"
          />
          <rect x="719" y="167" width="34" height="13" fill="#f5f5f5" />
          <text x="736" y="176" text-anchor="middle" class="arrow-label">파일 데이터</text>

          <path
            d="M665 576H770"
            fill="none"
            stroke="#4f5d75"
            stroke-width="1.1"
