          <rect x="786" y="140" width="38" height="15" rx="2" fill="#ececec" />
          <text x="805" y="151" text-anchor="middle" class="eyebrow">R2</text>
          <text x="834" y="152" class="node-title">비공개 보관함</text>
          <text x="786" y="179" class="node-copy">검사 전에는 누구도 열어 볼 수 없음</text>
          <text x="786" y="197" class="node-copy">새 파일 알림을 대기열로 전달</text>
          <text x="786" y="215" class="node-copy">검사 뒤 원본 삭제</text>
          <text x="786" y="234" class="mono">upload-quarantine-demo</text>

          <!-- Queue -->
          <rect
            x="770"
            y="332"
            width="210"
            height="100"
            rx="6"
            fill="#fff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <rect x="786" y="346" width="58" height="15" rx="2" fill="#ececec" />
          <text x="815" y="357" text-anchor="middle" class="eyebrow">대기열</text>
          <text x="854" y="358" class="node-title">scan-uploads</text>
          <text x="786" y="385" class="node-copy">검사할 파일 작업 전달</text>
          <text x="786" y="404" class="node-copy">실패한 작업 다시 시도</text>
          <text x="786" y="423" class="mono">Cloudflare 작업 대기열</text>

          <!-- D1 -->
          <rect
            x="770"
            y="536"
            width="210"
            height="106"
            rx="6"
            fill="#fff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <rect x="786" y="550" width="32" height="15" rx="2" fill="#ececec" />
          <text x="802" y="561" text-anchor="middle" class="eyebrow">DB</text>
          <text x="829" y="562" class="node-title">D1 · uploads 상태표</text>
          <text x="786" y="588" class="mono">uploading → scanning</text>
          <text x="786" y="606" class="mono">→ ready | rejected</text>
          <text x="786" y="627" class="node-copy">상태·파일 형식·거절 이유 저장</text>

          <!-- Public R2 -->
          <rect
            x="1032"
            y="536"
            width="198"
            height="106"
            rx="6"
            fill="#fff"
            stroke="#2d3142"
            stroke-width="1"
          />
          <rect x="1048" y="550" width="38" height="15" rx="2" fill="#ececec" />
          <text x="1067" y="561" text-anchor="middle" class="eyebrow">R2</text>
          <text x="1096" y="562" class="node-title">검사 통과 파일</text>
          <text x="1048" y="588" class="node-copy">검사와 사진 정보 제거 뒤 저장</text>
          <text x="1048" y="606" class="node-copy">ready일 때만 API가 전달</text>
          <text x="1048" y="627" class="mono">upload-public-demo</text>

          <!-- Bottom legend -->
          <line x1="42" y1="694" x2="1238" y2="694" stroke="#2d3142" stroke-opacity="0.16" />
          <line
